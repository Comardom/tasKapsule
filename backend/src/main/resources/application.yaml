server:
  port: 9999


spring:
  application:
    name: backend

  # 数据源配置
  datasource:
    url: jdbc:sqlite:${user.home}/.taskapsule/data/app.db
    driver-class-name: org.sqlite.JDBC

  # JPA 配置
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      # 不会删除现有的数据，如果表不存在，就创建，多一个字段就加一列
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 让 Hibernate 使用 SQLite 的命名策略
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# 日志配置（便于调试）
logging:
  # 设置日志文件存放路径
  file:
    name: ${user.home}/.taskapsule/logs/backend.log
  # 配置日志滚动策略（防止单个日志文件过大）
  logback:
      rollingpolicy:
        max-file-size: 10MB       # 单个文件最大 10MB
        max-history: 7            # 保留最近 7 天的日志
  level:
    root: INFO                  # 全局默认 INFO 级别
    xyz.taskapsule.backend: DEBUG  # 业务代码显示 DEBUG 级别信息
    org.hibernate.SQL: DEBUG    # 显示 Hibernate 生成的 SQL
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE # 显示 SQL 绑定的参数